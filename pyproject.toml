[build-system]
requires = [
    "setuptools>=61.0",
    "pybind11>=3.1.0",
    "wheel>=0.40.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "compilador_profesional"
version = "1.0.0"
description = "Compilador/Empaquetador con GUI profesional"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Tu Nombre", email = "tu@email.com"}
]
dependencies = [
    "PyQt5>=5.15",
    "pybind11>=3.1"
]

[project.scripts]
compilador = "src.main:main"

[project.urls]
Homepage = "https://github.com/tu-usuario/compilador-profesional"
Bug Reports = "https://github.com/tu-usuario/compilador-profesional/issues"
Source = "https://github.com/tu-usuario/compilador-profesional"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
src = ["*.pyd", "*.so", "*.dylib", "*.dll"]