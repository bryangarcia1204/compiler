name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── PRUEBAS UNITARIAS Y DE INTEGRACIÓN ──
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        # Excluir combinaciones que puedan dar problemas (opcional)
        exclude:
          - os: windows-latest
            python-version: '3.9'  # Windows 3.9 puede tener problemas con pybind11

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      # ── INSTALACIÓN DE DEPENDENCIAS DEL SISTEMA ──
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ python3-dev xvfb

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gcc llvm python3

      # En Windows ya no necesitamos instalar MinGW porque usamos MSVC
      # (MSVC ya está instalado en los runners de GitHub)

      # ── INSTALAR DEPENDENCIAS PYTHON ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-qt pytest-xdist pytest-timeout

      # ── COMPILACIÓN DEL MÓDULO C++ (UNIFICADA) ──
      - name: Build C++ extension
        run: |
          python setup.py build_ext --inplace

      # En Windows, `setup.py` usará MSVC automáticamente (gracias a options={'build_ext': {'compiler': 'msvc'}})
      # En Linux/macOS usará GCC/Clang.

      # ── PRUEBAS UNITARIAS (sin GUI ni integración) ──
      - name: Run unit tests
        timeout-minutes: 10
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      # ── SUBIR COBERTURA ──
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: ${{ matrix.os }},py${{ matrix.python-version }}
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # ── SUBIR LOGS EN CASO DE ERROR ──
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            compilador.log
            test-*.log
            pytest*.log
          retention-days: 7

  # ── LINTING Y ANÁLISIS ESTÁTICO ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install flake8 black isort autoflake mypy pylint

      - name: Auto-format (isort + black)
        run: |
          isort src/ --profile black --line-length 100
          black src/ --line-length 100

      - name: Remove unused imports/variables
        run: |
          autoflake --in-place --remove-all-unused-imports --remove-unused-variables --recursive src/

      - name: Run flake8
        run: flake8 src/ --max-line-length=100 --count --statistics

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional || true

  # ── PRUEBA DE BUILD (ejecutable) ──
  build-test:
    name: Build Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build C++ extension
        run: python setup.py build_ext --inplace

      - name: Test PyInstaller build
        run: |
          pyinstaller --onefile --windowed --name compilador src/main.py
          ls -la dist/ || dir dist\\

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: build-test-${{ matrix.os }}
          path: dist/
          retention-days: 7